server.address=${HTTP_HOST:0.0.0.0}
server.port=${HTTP_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=10s
server.tomcat.max-connections=512
server.tomcat.threads.max=256
server.tomcat.accept-count=128
grpc.target=${GRPC_TARGET:hello-world-grpc-service:50051}
grpc.tls=${GRPC_TLS:false}
grpc.timeout-ms=${GRPC_TIMEOUT_MS:3000}
client.static-dir=${STATIC_DIR:../../frontend/dist}
spring.web.resources.add-mappings=false
