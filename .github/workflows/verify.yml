name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/test.sh frontend
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, rust, java]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.language == 'go'
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        if: matrix.language == 'go'
        with:
          version: '36.2'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated Go stubs
        if: matrix.language == 'go'
        run: |
          bash scripts/generate-go.sh
          git diff --exit-code -- backends/go/gen
      - name: Install Rust
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt && rustup default 1.93.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        env:
          LANGUAGE: ${{ matrix.language }}
        run: bash scripts/test.sh "$LANGUAGE"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify deployable image builds
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: ${{ matrix.language }}
          build-args: CLIENT_LANGUAGE=${{ matrix.language }}
          push: false
          load: true
          tags: hello-world-client:test
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
      - name: Smoke test the runtime image
        run: bash scripts/smoke-image.sh hello-world-client:test
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'
          cache: false
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
      - run: node --test scripts/*.test.mjs
