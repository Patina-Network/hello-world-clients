name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/test.sh frontend
  backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, rust, java]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.language == 'go'
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum
      - name: Install protoc
        if: matrix.language == 'go'
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          mkdir -p "$HOME/.local"
          unzip -qo /tmp/protoc.zip -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check generated Go stubs
        if: matrix.language == 'go'
        run: |
          bash scripts/generate-go.sh
          git diff --exit-code -- backends/go/gen
      - name: Install Rust
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt && rustup default 1.93.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        env:
          LANGUAGE: ${{ matrix.language }}
        run: bash scripts/test.sh "$LANGUAGE"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Verify deployable image builds
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.language }}
          build-args: CLIENT_LANGUAGE=${{ matrix.language }}
          push: false
          load: true
          tags: hello-world-client:test
          cache-from: type=gha,scope=${{ matrix.language }}
          cache-to: type=gha,mode=max,scope=${{ matrix.language }}
      - name: Smoke test the runtime image
        run: bash scripts/smoke-image.sh hello-world-client:test
  deployment-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25'
          cache: false
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
      - run: node --test scripts/*.test.mjs
