# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: CI
run-name: Running continuous integration on ${{ github.actor }}'s commits

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontendPretest:
    name: Frontend pre-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}
          INSTALL_NPM: true
          NODE_VERSION: "24"

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Run pre-test checks
        uses: ./.github/composite/pretest
        with:
          LANGUAGE: frontend

  backendPretest:
    name: Backend pre-test (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [go, rust, java]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt

      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run pre-test checks
        uses: ./.github/composite/pretest
        with:
          LANGUAGE: ${{ matrix.language }}

  frontendTest:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: [frontendPretest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}
          INSTALL_NPM: true
          NODE_VERSION: "24"

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Run tests
        uses: ./.github/composite/test
        with:
          LANGUAGE: frontend

  backendTest:
    name: Backend tests (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: [backendPretest]

    strategy:
      fail-fast: false
      matrix:
        language: [go, rust, java]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.93.0

      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        uses: ./.github/composite/test
        with:
          LANGUAGE: ${{ matrix.language }}

  buildImage:
    name: Build ${{ github.event_name == 'pull_request' && 'staging' || 'production' }} image (${{ matrix.language }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [frontendTest, backendTest]

    if: >-
      github.ref_name == 'main' ||
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        language: [go, rust, java]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}
          HEADSCALE_ADDRESS: ${{ secrets.HEADSCALE_ADDRESS }}
          HEADSCALE_USER: ${{ secrets.HEADSCALE_USER }}
          HEADSCALE_PREAUTHKEY: ${{ secrets.HEADSCALE_PREAUTHKEY }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backends/go/go.mod
          cache-dependency-path: backends/go/go.sum

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.93.0

      - name: Set up Java
        if: matrix.language == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build image
        uses: ./.github/composite/build-image
        with:
          LANGUAGE: ${{ matrix.language }}
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_ID: ${{ github.event.pull_request.number }}
          ARCH: ${{ matrix.arch }}

  deployProduction:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [buildImage]

    if: github.ref_name == 'main'

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pipeline
        uses: tahminator/pipeline/actions/setup@f972931ee457aaa5c9961693055d60ddb272c3c2 # 1.0.91
        with:
          SECRETS: ${{ toJSON(secrets) }}

      - name: Test CI scripts
        run: bun run --cwd .github/scripts test

      - name: Deploy clients
        uses: ./.github/composite/deploy
        with:
          SHA: ${{ github.sha }}
